[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neurostreamlab"
version = "0.1.0"
description = "Hardware-free EEG replay and robustness research console"
requires-python = ">=3.12,<3.13"
authors = [{name = "Syed Abdullah Imam"}]
license = "MIT"
dependencies = [
 "numpy>=2.0,<3", "scipy>=1.14,<2", "pandas>=2.2,<3", "scikit-learn>=1.6,<2",
 "mne>=1.10,<2", "moabb>=1.2,<2", "brainflow>=5.18,<6", "torch>=2.7,<3",
 "braindecode>=1.2,<2", "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
 "pydantic>=2.10,<3", "pyyaml>=6,<7", "matplotlib>=3.9,<4", "typer>=0.15,<1",
 "safetensors>=0.5,<1", "httpx>=0.28,<1"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-PyYAML", "pypdf>=5,<7", "pymupdf>=1.26,<2"]
[project.scripts]
neurostreamlab = "neurostreamlab.cli:app"
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
[tool.hatch.build.targets.wheel]
packages = ["src/neurostreamlab"]
