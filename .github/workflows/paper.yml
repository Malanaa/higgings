name: Paper
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {python-version: '3.12'}
      - run: uv sync --frozen --extra dev
      - run: sudo apt-get update && sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended latexmk poppler-utils
      - run: make arxiv
      - uses: actions/upload-artifact@v4
        with: {name: manuscript, path: paper/main.pdf}
